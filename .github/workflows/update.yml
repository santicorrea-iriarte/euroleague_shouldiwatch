name: Update scores and deploy

on:
  schedule:
    - cron: "0 7 * * *"     # morning after (games end ~22:45 CET)
    - cron: "30 23 * * *"   # same night, for early risers / late games
  workflow_dispatch:
    inputs:
      refetch:
        description: "Re-download every game (after changing feature extraction)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Build scores
        run: python -m pipeline.build --season E2026 ${{ inputs.refetch && '--refetch' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/features site/data
          git diff --cached --quiet || git commit -m "data: update scores $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
